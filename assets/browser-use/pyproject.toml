# Lockfile workspace for the pinned Browser Use CLI, consumed by uv2nix from
# modules/ai/browser-use.nix. Not a Python project - `package = false` means
# nothing here is built or installed; the only job of this file is to give
# `uv lock` a single dependency to resolve, so uv.lock beside it pins
# browser-use and its ~265 transitive dependencies by version and hash.
#
# To bump browser-use: edit the version below, run
#   nix run nixpkgs#uv -- lock --directory assets/browser-use
# and commit the regenerated uv.lock.
#
# requires-python is narrowed to 3.12 deliberately. browser-use itself allows
# >=3.11,<4, but pinning one minor keeps the lock resolving to a single set of
# wheels rather than a marker-split superset, and 3.12 has the widest wheel
# coverage across this dependency set.
[project]
name = "hermes-browser-use"
version = "0.0.0"
description = "Pinned Browser Use CLI for Hermes' browser backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "browser-use==0.13.8",
]

[tool.uv]
package = false
